[project]
name = "sms-tool"
version = "0.1.0"
description = "Track crypto / airdrop opportunities from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
sms-tool = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
