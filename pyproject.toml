[project]
name = "sms-tool"
version = "0.2.0"
description = "Track crypto / airdrop opportunities from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "everlastingdi" }]

[project.scripts]
sms-tool = "main:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
